name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python sources
        run: python -m compileall -q scripts lib
      - name: Check skill entry
        run: |
          test -f SKILL.md
          grep -q '^name: a-share-grid$' SKILL.md
          test -f requirements.txt
